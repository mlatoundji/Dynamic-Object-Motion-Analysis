[project]
name = "dynamic-object-motion-analysis"
version = "0.1.0"
description = ""
authors = [
    {name = "MMyster", email = "mouradlatoundji@gmail.com"},
    {name = "Chengbo Zhang", email = "chengbozhang.cbz@gmail.com"},
    {name = "Le Hoang", email = "lehoangnguyen510@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "ultralytics>=8.0.0",
    "mediapipe>=0.9.0",
    "huggingface-hub>=0.20.0",
    "torch>=2.10.0",
    "jupyterlab>=4.5.5",
    "scikit-learn>=1.0",
    "tqdm>=4.0",
    "timm>=1.0.25",
]

[tool.poetry]
packages = [{ include = "doma" }]

[project.optional-dependencies]
hand = [
    "mediapipe>=0.10.14",
]
yolo = [
    "ultralytics>=8.2",
]
raft = [
    "torch>=2.2",
    "torchvision>=0.17",
]
train = [
    "torch>=2.2",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
]
dataset = [
    "pyyaml>=6.0",
    "tqdm>=4.66",
]
vit = [
    "timm>=0.9.0",
]

[project.scripts]
doma-live = "doma.cli:main"
doma-build-dataset = "doma.datasets.cli:main"
doma-train = "doma.modeling.train:main"
doma-live-classifier = "doma.live_classifier:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
